name: Publish Docker Image to GitHub Container Registry

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - elixir_version: "1.16"
            otp_version: "26"
            dir: "1.16/otp-26-void"
            tag_suffix: "1.16-otp-26-void"
          - elixir_version: "1.17"
            otp_version: "27"
            dir: "1.17/otp-27-void"
            tag_suffix: "1.17-otp-27-void"
          - elixir_version: "1.18"
            otp_version: "27"
            dir: "1.18/otp-27-void"
            tag_suffix: "1.18-otp-27-void"
          - elixir_version: "1.18"
            otp_version: "28"
            dir: "1.18/otp-28-void"
            tag_suffix: "1.18-otp-28-void"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.dir }}/Dockerfile
          push: true
          tags: |
            ghcr.io/youfun/elixir:${{ matrix.tag_suffix }}
          platforms: linux/amd64,linux/arm64/v8